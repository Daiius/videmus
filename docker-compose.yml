services:
  database:
    image: mysql:8.4
    container_name: videmus-database
    environment:
      TZ: "Asia/Tokyo"
      LANG: "ja_JP.UTF-8"
    env_file:
      - .env.database
    tmpfs:
      - /var/lib/mysql # テスト用、データは毎回削除される
    cap_add:
      - SYS_NICE
    healthcheck:
      test: mysql -u $$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e "select 1;"
      interval: 5s
      timeout: 20s
      retries: 3
      start_period: 5s

  database-preparation:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: videmus-database-preparation
    working_dir: /workspace/database
    env_file:
      - .env.database
    command: >
      sh -c "pnpm drizzle-kit push --dialect mysql --schema=./db/schema.ts --host=$$DB_HOST --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --database=$$MYSQL_DATABASE &&
             pnpm tsx addTestData.ts"
    depends_on:
      database:
        condition: service_healthy

  videmus-nextjs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: videmus-nextjs-dev
    working_dir: /workspace/next
    environment:
      TZ: "Asia/Tokyo"
    env_file:
      - .env.next
      - .env.database
    ports:
      - 3000:3000
    tmpfs:
      - /workspace/next/.next
    command: pnpm --filter videmus-next dev
    depends_on:
      database-preparation:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./next
          target: /workspace/next
          ignore:
            - node_modules/
            - .next/
        - action: sync
          path: ./database
          target: /workspace/database
          ignore:
            - node_modules/
        - action: sync
          path: ./resource-server
          target: /workspace/resource-server
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: pnpm-lock.yaml

  videmus-resource-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: videmus-resource-server
    working_dir: /workspace/resource-server
    env_file:
      - .env.resource-server
      - .env.database
    environment:
      DEBUG: "videmus:resource-server*"
      TZ: "Asia/Tokyo"
      MEDIA_SERVER_URL: http://videmus-media-server:4001
    ports:
      - 4000:4000
    command: pnpm --filter videmus-resource-server dev
    depends_on:
      database-preparation:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./resource-server
          target: /workspace/resource-server
          ignore:
            - node_modules/
            - dist/
        - action: sync
          path: ./database
          target: /workspace/database
          ignore:
            - node_modules/
        - action: sync
          path: ./media-server
          target: /workspace/media-server
          ignore:
            - node_modules/
            - dist/
            - "*.pem"
        - action: rebuild
          path: pnpm-lock.yaml

  videmus-media-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: videmus-media-server
    working_dir: /workspace/media-server
    env_file:
      - .env.media-server
    environment:
      DEBUG: "mediasoup*,videmus:media-server*"
      TZ: "Asia/Tokyo"
      DTLS_CERT: ./dtls-cert.pem
      DTLS_KEY: ./dtls-key.pem
      API_URL: http://videmus-resource-server:4000
    ports:
      - 4001:4001
      - 44400:44400/udp
      - 44400:44400/tcp
      - "50000-50010:50000-50010/udp"
    # DTLS の証明書と鍵はイメージに入れない（.dockerignore）。読み取り専用で見せる
    volumes:
      - ./media-server/dtls-cert.pem:/workspace/media-server/dtls-cert.pem:ro
      - ./media-server/dtls-key.pem:/workspace/media-server/dtls-key.pem:ro
    command: pnpm --filter videmus-media-server dev
    develop:
      watch:
        - action: sync
          path: ./media-server
          target: /workspace/media-server
          ignore:
            - node_modules/
            - dist/
            - "*.pem"
        - action: rebuild
          path: pnpm-lock.yaml

networks:
  default:
    name: videmus-network
